# Diagnostic only: shows where FTP lands and which FTP folder the live site serves.
# Uploads tiny marker files, checks them on the live site, then deletes them.
name: Inspect Hostinger folders

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Find the folder the website serves
        env:
          HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          auth=(--user "$FTP_USER:$FTP_PASS")
          ls_abs() { echo "== /$1"; curl -s --max-time 30 --list-only "${auth[@]}" "ftp://$HOST//$1" | sort | head -40; }
          ls_abs ""
          ls_abs "domains/"
          candidates=("public_html")
          for d in $(curl -s --max-time 30 --list-only "${auth[@]}" "ftp://$HOST//domains/" | grep -v '^\.'); do
            ls_abs "domains/$d/public_html/"
            candidates+=("domains/$d/public_html")
          done
          tag="marker-$RANDOM$RANDOM"
          echo "== marker test (200 = the live site serves this folder)"
          for c in "${candidates[@]}"; do
            name="$tag-$(echo "$c" | tr '/.' '--').txt"
            echo "$c" > m.txt
            curl -s --max-time 30 "${auth[@]}" -T m.txt "ftp://$HOST//$c/$name" || { echo "$c: upload failed"; continue; }
            sleep 3
            printf '%-50s main:%s  photography-sub:%s\n' "$c" \
              "$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' "https://rakeshkode.co.uk/$name?nc=$RANDOM")" \
              "$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' "https://photography.rakeshkode.co.uk/$name?nc=$RANDOM")"
            curl -s --max-time 30 "${auth[@]}" "ftp://$HOST//" -Q "DELE /$c/$name" -o /dev/null || echo "  (could not remove $name)"
          done
