# Builds both sites and uploads them to Hostinger on every push to main.
# Adding or deleting a file in photography/library/ updates the photography site in 1–2 minutes.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    e.g. ftp.rakeshkode.co.uk  (hPanel → Files → FTP Accounts)
#   FTP_USERNAME  e.g. u123456789
#   FTP_PASSWORD  your FTP account password
# Optional repository variable:
#   FTP_SERVER_DIR  folder on the server for rakeshkode.co.uk; defaults to /domains/rakeshkode.co.uk/public_html/
name: Build and deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      clean_slate:
        description: "Delete everything in the server folder before uploading (one-off reset)"
        type: boolean
        default: false

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: pip install Pillow==11.0.0 pillow-heif==0.18.0

      - name: Reuse resized photos from earlier runs
        uses: actions/cache@v4
        with:
          path: .build-cache
          key: photos-${{ hashFiles('photography/library/**') }}
          restore-keys: photos-

      - name: Build sites
        run: python scripts/build.py

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # Absolute path: this hosting account holds many sites, so never rely on the FTP start folder.
          server-dir: ${{ vars.FTP_SERVER_DIR || '/domains/rakeshkode.co.uk/public_html/' }}
          # Upload record kept on the server; a new name forces one full upload of every file.
          state-name: .deploy-state-v2.json
          # Only when started by hand with "clean_slate" ticked; pushes never delete anything.
          dangerous-clean-slate: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_slate }}
